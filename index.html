<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Sort Puzzle</title>
    <?!= include('styles'); ?>
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <div id="topbar">
        <button id="btn-home" title="Home">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/>
          </svg>
        </button>
        <span id="level-label">Level 1</span>
        <span id="moves-label">0 moves</span>
        <button id="btn-undo" title="Undo" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H9M3 10l4-4M3 10l4 4"/>
          </svg>
        </button>
        <button id="btn-restart" title="Restart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4v5h5M20 20v-5h-5a8 8 0 10-14.3-3.6"/>
          </svg>
        </button>
        <button id="btn-hint" title="Hint" disabled>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3M12 17h.01"/>
          </svg>
        </button>
        <button id="btn-sound" title="Toggle Sound">
          <svg id="icon-sound-on" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
          </svg>
          <svg id="icon-sound-off" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
            <path d="M11 5L6 9H2v6h4l5 4V5zM23 9l-6 6M17 9l6 6"/>
          </svg>
        </button>
      </div>

      <!-- Game area -->
      <div id="game-area">
        <div id="lanes-container"></div>
      </div>

      <!-- Win overlay -->
      <div id="win-overlay" class="hidden">
        <div class="win-card">
          <h2>🎉 Level Complete!</h2>
          <div id="win-stars" class="stars">⭐⭐⭐</div>
          <div id="win-stats"></div>
          <button id="btn-next" class="btn-primary">Next Level ▶</button>
        </div>
      </div>

      <!-- Home overlay -->
      <div id="home-overlay" class="hidden">
        <div class="home-card">
          <h1>🚗 Car Sort</h1>
          <p>Sort the cars into lanes by color.<br>Each lane holds <span id="cap-info">4</span> cars of one color.</p>
          <div id="home-stats"></div>
          <button id="btn-play" class="btn-primary">Play ▶</button>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <?!= include('game'); ?>
    <?!= include('ui'); ?>
  </body>
</html>
